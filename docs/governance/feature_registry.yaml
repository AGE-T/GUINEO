# SpeechStudio Feature Registry

> Authoritative list of features that ship in SpeechStudio.  Each
> feature has a stable ID, an owning layer, a status, and a gate
> (the condition under which it is enabled).  Features NOT listed
> here are not part of the product and MUST NOT be exposed in the UI.

## Status Values

- **planned**  : On the roadmap, not yet implemented.
- **experimental** : Implemented behind a feature gate; not enabled by default.
- **beta**     : Implemented and enabled by default; subject to change.
- **stable**   : Implemented, enabled, and frozen (changes require an ADR).
- **deprecated**: Still ships but scheduled for removal.
- **removed**  : No longer ships; entry kept for historical context.

