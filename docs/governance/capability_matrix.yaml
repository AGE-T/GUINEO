# SpeechStudio Capability Matrix

> Cross-reference of features (rows) against capabilities (columns).
> A "Y" means the feature fully provides the capability; a "P" means
> partial; a blank cell means "not provided".

## Capabilities

| Capability           | Description                                                |
|----------------------|------------------------------------------------------------|
| gen-plain            | Generate from plain text                                   |
| gen-tokens           | Generate from a prompt containing Higgs tokens             |
| gen-blocks           | Generate from a block-structured prompt                    |
| gen-raw              | Generate the literal editor text without re-building       |
| voice-clone          | Use a reference audio sample for voice cloning             |
| batch                | Run multiple generations sequentially                      |
| preset-apply         | Apply a saved preset to the control panel                  |
| preset-persist       | Save presets to disk (YAML/JSON)                           |
| preset-import-export | Import/export preset files                                 |
| pipeline-verify      | SHA-256 logging at every pipeline stage                    |
| line-numbers         | Editor shows line numbers                                  |
| syntax-highlight     | Editor highlights Higgs tokens                             |
| bracket-match        | Editor highlights matching brackets                        |
| search-replace       | Editor has a find/replace bar                              |
| inheritance-banner   | Control panel shows the active inheritance source          |

