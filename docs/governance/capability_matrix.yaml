## Layer -> Capability Coverage

| Layer  | Capabilities fully provided                                       |
|--------|-------------------------------------------------------------------|
| UI     | gen-plain, gen-tokens, gen-blocks, gen-raw, line-numbers,         |
|        | syntax-highlight, bracket-match, search-replace,                  |
|        | inheritance-banner, preset-apply (UI side), batch (UI side)       |
| Engine | voice-clone, batch (engine side), preset-persist,                 |
|        | preset-import-export, pipeline-verify                             |

## Capability Gaps

| Capability            | Gap description                                                  |
|-----------------------|------------------------------------------------------------------|
| (none currently)      | All capabilities are covered by at least one feature.            |

## Test Coverage

| Capability           | Manual test path                                            | Automated test          |
|----------------------|-------------------------------------------------------------|-------------------------|
| gen-plain            | Type text -> Generate -> WAV produced                       | tools/verify_integration|
| gen-tokens           | Use PromptBuilder -> Generate                               | tools/verify_integration|
| gen-blocks           | Switch to Narration Blocks -> Generate                      | (manual)                |
| gen-raw              | Toggle Raw Mode -> Generate                                 | (manual)                |
| voice-clone          | Import WAV -> select voice -> Generate                      | (manual)                |
| batch                | Tools -> Batch Generation -> add jobs -> Start              | (manual)                |
| preset-apply         | Sidebar -> Presets -> double-click                          | (manual)                |
| preset-persist       | Save preset -> restart app -> preset still listed           | tools/verify_integration|
| pipeline-verify      | Generate -> inspect logs/engine.log for SHA-256 lines       | tools/verify_integration|
