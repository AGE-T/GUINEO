version: 1

jobs:

# ============================================================
# TESZT 1 — Alap szöveg, hangklónozás, baseline
# ============================================================
- name: "T1 - Baseline (klón, nincs token)"
  prompt: |
    Szia! Ez egy rövid teszt mondat, amivel ellenőrzöm a hangklónozás minőségét.
    A cél az, hogy hallható legyen a természetes beszédritmus és a magyar kiejtés.
  voice_id: null
  output_filename: t01_baseline.wav
  parameters:
    temperature: 1.2
    top_p: 0.95
    top_k: 300
    max_new_tokens: 4096
    seed: null
    append_silence: 0.5
    normalize_output: false
    auto_play: false
    output_format: wav

